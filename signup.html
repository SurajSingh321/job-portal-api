<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup - Job Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Arial', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .box { background: white; padding: 40px; border-radius: 15px; width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: #667eea; font-size: 28px; }
        .logo p { color: #999; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #555; font-size: 14px; font-weight: bold; }
        input, select { width: 100%; padding: 12px 15px; border: 2px solid #eee; border-radius: 8px; font-size: 14px; transition: border 0.3s; outline: none; }
        input:focus, select:focus { border-color: #667eea; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; transition: opacity 0.3s; }
        button:hover { opacity: 0.9; }
        .msg { text-align: center; margin-top: 15px; padding: 10px; border-radius: 8px; font-size: 14px; }
        .msg.error { background: #ffe0e0; color: #e74c3c; }
        .msg.success { background: #e0ffe0; color: #27ae60; }
        .link { text-align: center; margin-top: 20px; color: #999; font-size: 14px; }
        .link a { color: #667eea; text-decoration: none; font-weight: bold; }
        .role-btns { display: flex; gap: 10px; }
        .role-btn { flex: 1; padding: 12px; border: 2px solid #eee; border-radius: 8px; background: white; cursor: pointer; font-size: 14px; transition: all 0.3s; }
        .role-btn.active { border-color: #667eea; background: #667eea; color: white; }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">
            <h1>💼 JobPortal</h1>
            <br>
            <p>Find your dream job</p>
        </div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Name">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="Email@example.com">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Password">
        </div>

        <div class="form-group">
            <label>Role</label>
            <div class="role-btns">
                <button class="role-btn active" id="studentBtn" onclick="selectRole('student')">🎓 Student</button>
                <button class="role-btn" id="companyBtn" onclick="selectRole('company')">🏢 Company</button>
            </div>
        </div>

        <button onclick="signup()">Create Account</button>
        <div class="msg" id="message" style="display:none"></div>
        <p class="link">Already have account? <a href="login.html">Login</a></p>
    </div>

    <script>
        let selectedRole = "student";

        function selectRole(role) {
            selectedRole = role;
            document.getElementById("studentBtn").classList.toggle("active", role === "student");
            document.getElementById("companyBtn").classList.toggle("active", role === "company");
        }

        async function signup() {
            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;

            let response = await fetch("http://localhost:8080/signup", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, email, password, role: selectedRole })
            });

            let data = await response.json();
            let msgEl = document.getElementById("message");
            msgEl.style.display = "block";

            if (data.message === "User ban gaya!") {
                msgEl.className = "msg success";
                msgEl.innerText = "Account ban gaya! Login karo...";
                setTimeout(() => window.location.href = "login.html", 1500);
            } else {
                msgEl.className = "msg error";
                msgEl.innerText = data.message;
            }
        }
       
    </script>
</body>
</html>
