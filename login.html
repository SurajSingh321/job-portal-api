<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Job Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .box { background: white; padding: 40px; border-radius: 15px; width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: #667eea; font-size: 28px; }
        .logo p { color: #999; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #555; font-size: 14px; font-weight: bold; }
        input { width: 100%; padding: 12px 15px; border: 2px solid #eee; border-radius: 8px; font-size: 14px; transition: border 0.3s; outline: none; }
        input:focus { border-color: #667eea; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { opacity: 0.9; }
        .msg { text-align: center; margin-top: 15px; padding: 10px; border-radius: 8px; font-size: 14px; }
        .msg.error { background: #ffe0e0; color: #e74c3c; }
        .link { text-align: center; margin-top: 20px; color: #999; font-size: 14px; }
        .link a { color: #667eea; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">
            <h1>💼 JobPortal</h1>
            <p>Welcome back!</p>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="email@example.com">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Password">
        </div>

        <button onclick="login()">Login</button>
        <div class="msg error" id="message" style="display:none"></div>
        <p class="link">Account nahi hai? <a href="signup.html">Signup</a></p>
    </div>

    <script>
        async function login() {
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;

            let response = await fetch("http://localhost:8080/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });

            let data = await response.json();

            if (data.token) {
                localStorage.setItem("token", data.token);
                localStorage.setItem("role", data.role);
                if (data.role === "company") {
                    window.location.href = "company.html";
                } else {
                    window.location.href = "jobs.html";
                }
            } else {
                let msgEl = document.getElementById("message");
                msgEl.style.display = "block";
                msgEl.innerText = data.message;
            }
        }
    </script>
</body>
</html>
